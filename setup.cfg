[isort]
profile = black
skip =
    .pytype
    .venv
    runs

[flake8]
max-line-length = 88
exclude = .git,__pycache__,.venv,build,dist,runs
# E203 is emitted by black's slice formatting; the two tools disagree and
# black wins, per PEP 8's own note on slice colons.
extend-ignore = F401, E266, F841, E203