[isort]
profile = black
skip =
    .pytype
    .venv
    build
    dist
    docs

[flake8]
max-line-length = 88
# `runs` and `docs` hold generated material -- training logs and the report
# with its one-off analysis scripts. Neither is part of the package.
exclude = .git,__pycache__,.venv,build,dist,runs,docs
# E203 is emitted by black's slice formatting; the two tools disagree and
# black wins, per PEP 8's own note on slice colons.
extend-ignore = F401, E266, F841, E203